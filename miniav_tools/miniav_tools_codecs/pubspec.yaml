name: miniav_tools_codecs
description: First-party codecs for miniav_tools — GPU-compute (WGSL via minigpu), hardware (Media Foundation / vendor SDKs), and audio. FFmpeg is the software/container fallback.
version: 0.7.6
repository: https://github.com/PracticalXR/miniAV/tree/master/miniav_tools/miniav_tools_codecs
environment:
  sdk: ^3.11.4

dependencies:
  spawn: ^0.1.0
  miniav_tools_platform_interface: ^0.5.7
  miniav_platform_interface: ^0.7.4
  minigpu_platform_interface: ^1.8.1
  minigpu: ^1.8.1
  # Web (WebCodecs + MSE) codec backend — see lib/web.dart. Only used on web.
  web: ^1.1.0
  gpu_tensor: ^1.8.1
  gpu_pipeline: ^1.8.1
  meta: ^1.16.0
  # FFI bindings to the first-party native codecs lib (Opus + Media Foundation).
  ffi: ^2.1.4
  # Native-assets build-hook deps (build `native/` → miniav_tools_codecs_native).
  # These MUST be real dependencies, not dev_dependencies: a consumer does not
  # get our dev_dependencies, so hook/build.dart could not resolve its own
  # imports and the native asset silently failed to build for everyone
  # downstream. `dart pub publish` flags this; 0.6.1 shipped past it.
  code_assets: ^1.2.1
  hooks: ^2.0.2
  logging: ^1.2.0
  native_toolchain_cmake: ^0.2.7

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  image: ^4.5.0
  benchmark_harness: ^2.3.1
  # Test-only: FFmpeg encoder to produce H.264 test packets for the MF decode
  # tests (no cycle — miniav_tools_ffmpeg does not depend on codecs).
  miniav_tools_ffmpeg: ^0.5.5
  # Test-only: the facade, to prove the negotiator selects the FFmpeg-free
  # MF + Opus backends over FFmpeg (ffmpeg_free_path_test.dart).
  miniav_tools: ^0.5.6

# Bundles the WASM codecs module (libopus compiled to WebAssembly) for web. The
# files live under lib/web/ and are served to apps at
# assets/packages/miniav_tools_codecs/web/… (see CodecsWasm._glueUrl). Honoured
# by the Flutter build even though this is a pure-Dart package.
flutter:
  assets:
    - packages/miniav_tools_codecs/web/miniav_codecs.js
    - packages/miniav_tools_codecs/web/miniav_codecs.wasm
    # Compiled worker payload (`dart run spawn:build`), served at
    # assets/packages/miniav_tools_codecs/workers/build/… — the URL
    # SpawnEntry's asset id resolves to. Committed, so an app consuming this
    # package builds nothing.
    - packages/miniav_tools_codecs/workers/build/demux_worker.dart.js
    - packages/miniav_tools_codecs/workers/build/codec_worker.dart.js
    - packages/miniav_tools_codecs/workers/build/audio_playback_worker.dart.js
    # The AudioWorklet processor. Plain JS, not a compiled payload: it is
    # constructed inside the worklet global scope, which has no DOM and no
    # module loader, and its whole body must stay a bounded copy loop.
    - packages/miniav_tools_codecs/web/miniav_audio_ring_worklet.js
