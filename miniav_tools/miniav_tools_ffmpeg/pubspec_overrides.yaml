dependency_overrides:
  miniav_tools_platform_interface:
    path: ../miniav_tools_platform_interface
  # spawn is not on pub.dev yet; this path override is what lets the port be
  # written and tested before the first publish. Removing it (or publishing
  # spawn) is a prerequisite for releasing this package.
  spawn:
    path: ../../../spawn/spawn
  miniav_platform_interface:
    path: ../../miniav_platform_interface
  minigpu_platform_interface:
    path: ../../../minigpu/minigpu_platform_interface
  miniav_ffi:
    path: ../../miniav_ffi
  miniav_web:
    path: ../../miniav_web
  minigpu:
    path: ../../../minigpu/minigpu
  minigpu_ffi:
    path: ../../../minigpu/minigpu_ffi
  minigpu_web:
    path: ../../../minigpu/minigpu_web
